# ─────────────────────────────────────────────────────────────────
#  Close-Scale (Altrium CRM) — Local Development Stack
#
#  Usage:
#    1. cp .env.example .env  (fill in your values)
#    2. docker-compose up --build
#
#  Services:
#    db       → PostgreSQL 16
#    backend  → Django 5 via Daphne (ASGI)
# ─────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ─────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5


  # ── Django Backend (Daphne ASGI) ──────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: backend.settings
      DEBUG: "True"
      POSTGRES_HOST: db
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --no-input &&
             python manage.py runserver 0.0.0.0:8000"


volumes:
  postgres_data:
